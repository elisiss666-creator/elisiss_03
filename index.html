<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10284f">
  <meta name="description" content="適合國小六年級的法律與道德情境思辨遊戲。">
  <title>天秤之城：平行時空</title>
  <link rel="preload" as="image" href="assets/images/v3/map-hub-3d.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar" aria-label="遊戲狀態">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">⚖</span>
        <div><h1>天秤之城</h1><p id="worldName">平行時空思辨任務</p></div>
      </div>
      <div class="meters" aria-label="思辨能量">
        <div class="meter meter-rules">
          <span class="meter-icon" aria-hidden="true">⚖</span><span class="meter-label">規則守護</span>
          <span class="meter-track"><span id="rulesFill" class="meter-fill"></span></span><strong id="rulesValue">45</strong>
        </div>
        <div class="meter meter-care">
          <span class="meter-icon" aria-hidden="true">♥</span><span class="meter-label">關懷溫度</span>
          <span class="meter-track"><span id="careFill" class="meter-fill"></span></span><strong id="careValue">45</strong>
        </div>
      </div>
      <div class="top-actions">
        <button id="journalBtn" class="round-btn" type="button" aria-label="查看任務紀錄" title="任務紀錄">📋</button>
        <button id="soundBtn" class="round-btn" type="button" aria-label="關閉音效" title="音效">🔊</button>
        <button id="helpBtn" class="round-btn" type="button" aria-label="查看操作說明" title="操作說明">?</button>
      </div>
    </header>
    <nav class="chapter-rail" aria-label="關卡進度">
      <ol id="chapterRail">
        <li data-chapter="0" class="is-current"><span>起點</span></li>
        <li data-chapter="1"><span>只看規定城</span></li>
        <li data-chapter="2"><span>只靠勸說森林</span></li>
        <li data-chapter="3"><span>合作島</span></li>
        <li data-chapter="4"><span>天秤議會</span></li>
      </ol>
    </nav>
    <main class="game-wrap">
      <section id="gameViewport" class="game-viewport" aria-label="遊戲場景" tabindex="0">
        <img id="worldBackground" class="world-background" src="assets/images/v3/map-hub-3d.png" alt="天秤之城中央廣場">
        <div class="scene-shade" aria-hidden="true"></div>
        <div class="quest-card" aria-live="polite"><span class="quest-kicker">目前任務</span><strong id="questText">前往中央天秤，展開冒險</strong></div>
        <div id="npcLayer" class="npc-layer" aria-hidden="true"></div>
        <div id="hotspotLayer" class="hotspot-layer"></div>
        <div id="robot" class="actor robot" aria-hidden="true"><img src="assets/images/v3/characters/xiaoheng/master_rgba.png" alt=""></div>
        <div id="player" class="actor player" aria-label="玩家角色">
          <img src="assets/images/v3/characters/player/master_rgba.png" alt="背著藍色書包的學生冒險者"><span class="actor-shadow" aria-hidden="true"></span>
        </div>
        <div id="nearHint" class="near-hint" role="status" aria-live="polite"><kbd>E</kbd><span>互動</span></div>
        <div class="evidence-chip" aria-live="polite"><span aria-hidden="true">🔎</span><span>證據卡</span><strong id="evidenceCount">0</strong></div>
        <div id="touchControls" class="touch-controls" aria-label="觸控操作">
          <div id="joystick" class="joystick" aria-label="虛擬搖桿"><span id="joystickKnob" class="joystick-knob"></span></div>
          <button id="interactBtn" class="interact-btn" type="button" aria-label="互動">☝<span>互動</span></button>
        </div>
      </section>
    </main>
    <footer class="game-footer">
      <span><b>電腦：</b>方向鍵／WASD 移動，E 或空白鍵互動</span>
      <span><b>iPad：</b>拖曳搖桿移動，點右側手掌互動</span>
      <span id="saveState">進度會自動保存在這台裝置</span>
    </footer>
  </div>
  <div id="modalRoot" class="modal-root" aria-live="polite"></div>
  <noscript>這個遊戲需要啟用 JavaScript 才能進行。</noscript>
  <script src="game.js"></script>
</body>
</html>
